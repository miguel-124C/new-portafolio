<div id="container">
    <div class="info">
        <h2>{{ proyect.name }}</h2>
        <p>{{ proyect.description }}</p>

        <div class="tecnologys">
            <h3>Tecnologias:</h3>
            <ul class="list-tecnologys">
                <li *ngFor="let tecnology of proyect.useTecnology"
                    [title]="tecnology.name">
                    <i [class]="tecnology.classIcon" [style]="'color:'+tecnology.color"></i>
                </li>
            </ul>
        </div>
    </div>
    <div class="contain-card">
        <iframe width="640" height="360" [src]="safeHref" title="YouTube video player" frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin" allowfullscreen>
        </iframe>
    </div>
</div>
