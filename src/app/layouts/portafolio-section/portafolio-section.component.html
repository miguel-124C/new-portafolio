<div class="contain">
    <div class="container">

        <div class="title">
            <h1 class="text-linear">Proyectos</h1>
            <p>
                Proyectos hechos personalmente. Con la idea de poner en practica lo aprendido.
            </p>
        </div>
    
        <div class="containGallery containProyects" *ngIf="!isProyectInProgress ; else inProgress">
            <div class="btnToggleProyects" *ngIf="listProyectsInProgress.length > 0" (click)="toggleProyects()">
                Ver proyectos en proceso
            </div>
            <div class="filters">
                <ul>
                    <li *ngFor="let filter of filters"
                        (click)="filterByCategory(filter.category)"
                        [ngClass]="{ 'filter-select': filter.category == currentCategory }">
                        {{ filter.name }}
                    </li>
                </ul>
            </div>

            <div *ngFor="let proyect of listProyects" class="contain-galery">
                <c-galeria [proyect]="proyect"></c-galeria>
            </div>
            <!-- <div class="container">
                <app-pagination [list]="listProyects" [limit]="8"
                (onChangeOffset)="onChangeOffset($event)"></app-pagination>
            </div> -->
        </div>

        <ng-template #inProgress>
            <div class="inProgressTitle">
                <h2>Proyectos en proceso</h2>
                <div class="btnToggleProyects" (click)="toggleProyects()">
                    Ver proyectos completos
                </div>
                <br>
                <span style="color: red;">Esta sección está en proceso!!</span>
            </div>
            <div class="containGallery">

                <div *ngFor="let proyect of listProyectsInProgress" class="contain-galery">
                    <c-galeria [proyect]="proyect"></c-galeria>
                </div>
            </div>
        </ng-template>
        
    
    </div>    
</div>
